name: Screen Translator checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect source tree
        id: files
        shell: bash
        run: |
          if [ -f screen_translator/core.py ] && [ -f launcher/update.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Waiting for source upload."
          fi
      - name: Install Python dependencies
        if: steps.files.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile and import
        if: steps.files.outputs.present == 'true'
        run: |
          python -m compileall -q screen_translator launcher tools
          python -c "import screen_translator.core, screen_translator.chat_mode, launcher.update"
      - name: Core translator tests (headless)
        if: steps.files.outputs.present == 'true'
        run: python -m unittest discover -s tests -p "test_core.py" -v
      - name: Launcher tests
        if: steps.files.outputs.present == 'true'
        run: python -m unittest discover -s tests_launcher -p "test_*.py" -v
